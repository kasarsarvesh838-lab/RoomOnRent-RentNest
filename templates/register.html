<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Register | Room on Rent</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --primary: #6C63FF;
      --primary-light: #8A84FF;
      --primary-dark: #5850E0;
      --text-dark: #2D3748;
      --text-light: #718096;
      --bg-white: #FFFFFF;
      --shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
      --radius: 12px;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Poppins', 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #cac5e1 0%, #022977f1 100%);
      color: var(--text-dark);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .form-container {
      width: 100%;
      max-width: 420px;
    }

    .form-header {
      text-align: center;
      margin-bottom: 2rem;
    }

    .form-header h1 {
      color: var(--bg-white);
      font-size: 2.2rem;
      font-weight: 700;
      margin-bottom: 0.5rem;
    }

    .form-header p {
      color: rgba(255, 255, 255, 0.8);
      font-size: 1rem;
    }

    .auth-form {
      padding: 2.5rem;
      background: var(--bg-white);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .form-group label {
      font-weight: 600;
      font-size: 0.95rem;
      color: var(--text-dark);
      text-align: left;
    }

    .form-control {
      padding: 14px 16px;
      border: 1px solid #E2E8F0;
      border-radius: 8px;
      font-size: 1rem;
      transition: all 0.3s ease;
      font-family: 'Poppins', sans-serif;
    }

    .form-control:focus {
      border-color: var(--primary);
      outline: none;
      box-shadow: 0 0 0 3px rgba(108, 99, 255, 0.2);
    }

    .submit-btn {
      padding: 14px;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
      color: var(--bg-white);
      cursor: pointer;
      transition: all 0.3s ease;
      margin-top: 0.5rem;
    }

    .submit-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(108, 99, 255, 0.3);
    }

    .form-footer {
      text-align: center;
      margin-top: 1.5rem;
      font-size: 0.95rem;
      color: var(--text-light);
    }

    .form-footer a {
      color: var(--primary);
      text-decoration: none;
      font-weight: 600;
      transition: color 0.3s;
    }

    .form-footer a:hover {
      color: var(--primary-dark);
      text-decoration: underline;
    }
    
    /* NEW: Style to hide the secret code field initially */
    .hidden-field {
        display: none !important;
    }

    @media (max-width: 576px) {
      .form-container {
        max-width: 100%;
      }
      
      .auth-form {
        padding: 2rem 1.5rem;
      }
      
      .form-header h1 {
        font-size: 1.8rem;
      }
    }
  </style>
</head>

<body>
  <div class="form-container">
    <div class="form-header">
      <h1><i class="fas fa-home"></i> RoomOnRent</h1>
      <p>Create your account</p>
    </div>

    <form class="auth-form" id="registerForm" method="post">
      <div class="form-group">
        <label for="username">Username:</label>
        <input type="text" name="username" id="username" class="form-control" required>
      </div>

      <div class="form-group">
        <label for="password">Password:</label>
        <input type="password" name="password" id="password" class="form-control" required>
      </div>

      <div class="form-group">
        <label for="role">Role:</label>
        <select name="role" id="role" class="form-control" required onchange="toggleSecretCode()">
          <option value="">-- Select Role --</option>
          <option value="Student">Student</option>
          <option value="Admin">Admin</option>
          <option value="Govt Employee">Govt Employee</option>
          <option value="Owner">Owner</option>
          <option value="User">User</option>
        </select>
      </div>

      <div class="form-group hidden-field" id="secretCodeGroup">
        <label for="owner_secret_code">Owner Secret Code:</label>
        <input type="password" name="owner_secret_code" id="owner_secret_code" class="form-control" placeholder="Enter secret code to register as Owner">
      </div>

      <button type="submit" class="submit-btn">Register</button>

      <div class="form-footer">
        Already have an account? <a href="{{ url_for('login') }}">Login</a>
      </div>
    </form>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    // Function to show/hide the secret code field
    function toggleSecretCode() {
        const roleSelect = document.getElementById("role");
        const secretCodeGroup = document.getElementById("secretCodeGroup");
        const secretCodeInput = document.getElementById("owner_secret_code");

        if (roleSelect.value === "Owner") {
            secretCodeGroup.classList.remove("hidden-field");
            // Set 'required' attribute when role is Owner
            secretCodeInput.setAttribute("required", "required"); 
        } else {
            secretCodeGroup.classList.add("hidden-field");
            // Remove 'required' attribute for other roles and clear the value
            secretCodeInput.removeAttribute("required");
            secretCodeInput.value = ""; 
        }
    }

    document.getElementById("registerForm").addEventListener("submit", function(event) {
        let username = document.getElementById("username").value.trim();
        let password = document.getElementById("password").value.trim();
        let role = document.getElementById("role").value;
        let secretCode = document.getElementById("owner_secret_code").value.trim();

        if (username.length < 3) {
            alert("⚠ Username must be at least 3 characters long.");
            event.preventDefault();
            return;
        }

        // NOTE: Frontend validation matches the backend check (Min 4 chars now, previously 6 was suggested in alert)
        if (password.length < 4) { 
            alert("⚠ Password must be at least 4 characters long.");
            event.preventDefault();
            return;
        }

        if (role === "") {
            alert("⚠ Please select a role.");
            event.preventDefault();
            return;
        }
        
        // Frontend check for Secret Code if Owner is selected (helps UX, but server check is final)
        if (role === "Owner" && secretCode.length === 0) {
            alert("⚠ Please enter the Owner Secret Code.");
            event.preventDefault();
            return;
        }


        // All validation passed. The form will now submit to the server for final processing 
        // and the secret code check will happen in app.py.
        // The original success alert is removed as a redirect is expected from Flask on success.
    });
    
    // Initial call to hide the field if the page loads and Owner isn't selected (for browsers saving state)
    document.addEventListener('DOMContentLoaded', toggleSecretCode);
  </script>
</body>
</html>
